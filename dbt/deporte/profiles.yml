# Perfil de conexión de dbt. NUNCA se escriben credenciales aquí: todos los
# valores sensibles se leen de variables de entorno con env_var(), que en
# Docker llegan desde el archivo .env y en CI desde los Secrets de GitHub.
deporte:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DEPORTE_PIPELINE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DEPORTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'DEPORTE_DB') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 4
      client_session_keep_alive: false
